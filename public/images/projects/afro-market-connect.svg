<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c" />
      <stop offset="100%" stop-color="#11141f" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="680" cy="120" r="180" fill="#2563eb" opacity="0.08" filter="blur(40px)" />
  <circle cx="120" cy="380" r="140" fill="#10b981" opacity="0.06" filter="blur(40px)" />
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Marketplace Dashboard / Escrow Card -->
  <g transform="translate(130, 95)">
    <rect width="370" height="220" rx="16" fill="url(#cardGlow)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="50" cy="50" r="16" fill="#10b981" fill-opacity="0.8" />
    <circle cx="72" cy="50" r="16" fill="#3b82f6" fill-opacity="0.6" />
    <text x="50" y="115" fill="#94a3b8" font-family="system-ui" font-size="11" letter-spacing="2">AFRO MARKET CONNECT • B2B TRADE</text>
    <text x="50" y="148" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="1">ESCROW VOLUME: $1.42M</text>
    <text x="50" y="185" fill="#34d399" font-family="system-ui" font-size="14" font-weight="600">Cross-Border Settlement Active</text>
    <rect x="255" y="165" width="85" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="297" y="182" fill="#34d399" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">VERIFIED B2B</text>
  </g>

  <!-- Live Orders & Trade Feeds -->
  <g transform="translate(430, 160)">
    <rect width="250" height="230" rx="14" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="20" y="32" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="600">Active Trade Routes</text>
    
    <g transform="translate(20, 52)">
      <circle cx="12" cy="12" r="12" fill="#10b981" fill-opacity="0.15" />
      <path d="M12 7 L12 17 M7 12 L17 12" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
      <text x="34" y="12" fill="#ffffff" font-family="system-ui" font-size="12">Agro Export Dispatch</text>
      <text x="34" y="24" fill="#64748b" font-family="system-ui" font-size="10">Nigeria → Kenya Hub</text>
      <text x="195" y="16" fill="#10b981" font-family="system-ui" font-size="12" text-anchor="end">42.5 Tons</text>
    </g>

    <g transform="translate(20, 106)">
      <circle cx="12" cy="12" r="12" fill="#3b82f6" fill-opacity="0.15" />
      <path d="M7 12 L17 12" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" />
      <text x="34" y="12" fill="#ffffff" font-family="system-ui" font-size="12">Multi-Vendor Settlement</text>
      <text x="34" y="24" fill="#64748b" font-family="system-ui" font-size="10">Automated Split Payout</text>
      <text x="195" y="16" fill="#60a5fa" font-family="system-ui" font-size="12" text-anchor="end">₦18.4M</text>
    </g>

    <g transform="translate(20, 160)">
      <circle cx="12" cy="12" r="12" fill="#eab308" fill-opacity="0.15" />
      <path d="M12 7 L12 17 M7 12 L17 12" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" />
      <text x="34" y="12" fill="#ffffff" font-family="system-ui" font-size="12">Artisan Wholesale Order</text>
      <text x="34" y="24" fill="#64748b" font-family="system-ui" font-size="10">Transit: Lagos Port</text>
      <text x="195" y="16" fill="#eab308" font-family="system-ui" font-size="12" text-anchor="end">In Escrow</text>
    </g>
  </g>
</svg>
