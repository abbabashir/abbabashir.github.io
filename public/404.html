<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bashir Aliyu — Portfolio</title>
    <script>
      // Single Page redirect for GitHub Pages (preserves hashes and search params)
      var l = window.location;
      var repoBase = l.pathname.split('/')[1];
      // For username.github.io sites or custom domains, redirect to root; for subpath repos, keep subpath
      var redirectPath = (repoBase && repoBase !== 'index.html' && !repoBase.includes('.')) 
        ? '/' + repoBase + '/' 
        : '/';
      window.location.replace(redirectPath + (l.search || '') + (l.hash || ''));
    </script>
  </head>
  <body>
  </body>
</html>
